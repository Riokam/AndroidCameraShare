<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <link rel="icon" href="data:,">
  <title>CameraShare</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #f8fafc;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      padding: 0;
      background: #020617;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      height: 100svh;
      overflow: hidden;
      overscroll-behavior: none;
    }
    .stage {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    video.landscape-rotate {
      position: absolute;
      left: 50%;
      top: 50%;
      object-fit: contain;
    }
    .hud {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      z-index: 2;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      padding:
        calc(10px + env(safe-area-inset-top, 0px))
        max(12px, env(safe-area-inset-right, 0px))
        28px
        max(12px, env(safe-area-inset-left, 0px));
      background: linear-gradient(rgba(2, 6, 23, .8), transparent);
      pointer-events: none;
    }
    #status, #battery, #wake-hint {
      margin: 0;
      padding: 7px 11px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 999px;
      background: rgba(15, 23, 42, .66);
      font-size: clamp(12px, 2.8vw, 14px);
      line-height: 1.2;
      text-shadow: 0 1px 2px #000;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }
    #status:empty, #battery:empty, #wake-hint:empty { display: none; }
    #battery, #wake-hint { color: #cbd5e1; }
    #status.error {
      color: #fecdd3;
      border-color: rgba(251, 113, 133, .35);
      background: rgba(136, 19, 55, .68);
    }
    .actions {
      position: absolute;
      left: 50%;
      bottom: max(10px, env(safe-area-inset-bottom, 0px));
      z-index: 2;
      display: flex;
      gap: clamp(6px, 2vw, 10px);
      align-items: center;
      justify-content: center;
      max-width: calc(100% - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 999px;
      background: rgba(15, 23, 42, .72);
      box-shadow: 0 14px 38px rgba(0, 0, 0, .38);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      transform: translateX(-50%);
    }
    .icon-btn {
      width: clamp(44px, 12vw, 52px);
      height: clamp(44px, 12vw, 52px);
      flex: 0 0 auto;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 50%;
      background: rgba(255, 255, 255, .1);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color .18s, transform .15s, border-color .18s;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, .2); }
    .icon-btn:active { transform: scale(.96); }
    .icon-btn:focus-visible {
      outline: 3px solid rgba(125, 211, 252, .85);
      outline-offset: 2px;
    }
    .icon-btn.stop {
      color: #fff;
      border-color: rgba(251, 113, 133, .35);
      background: rgba(190, 18, 60, .76);
    }
    .icon-btn.stop:hover { background: rgba(225, 29, 72, .88); }
    .icon-btn svg { width: 22px; height: 22px; fill: currentColor; display: block; }
    .icon-btn.stop svg { width: 16px; height: 16px; }
    .icon-btn .fs-exit { display: none; }
    .icon-btn.fs-on .fs-enter { display: none; }
    .icon-btn.fs-on .fs-exit { display: block; }
    .icon-btn[hidden] { display: none; }
    .stage:fullscreen,
    .stage:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      height: 100svh;
      background: #000;
    }
    @media (hover: none) and (pointer: coarse) {
      .actions {
        opacity: 0;
        pointer-events: none;
        transform: translateX(-50%) translateY(8px);
        transition: opacity .2s, transform .2s;
      }
      body.controls-on .actions {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0);
      }
    }
    @media (max-height: 430px) and (orientation: landscape) {
      .hud {
        padding-top: max(6px, env(safe-area-inset-top, 0px));
      }
      #status, #battery, #wake-hint { padding: 5px 9px; }
      .actions {
        bottom: max(6px, env(safe-area-inset-bottom, 0px));
        padding: 6px;
      }
      .icon-btn { width: 42px; height: 42px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .actions, .icon-btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <video id="video" autoplay playsinline></video>
    <div class="hud" aria-live="polite">
      <p id="status" role="status"></p>
      <p id="battery"></p>
      <p id="wake-hint"></p>
    </div>
    <div class="actions">
      <button id="stop" class="icon-btn stop" type="button" aria-label="Остановить просмотр" title="Стоп">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
      <button id="watch" class="icon-btn" type="button" hidden aria-label="Смотреть" title="Смотреть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="retry" class="icon-btn" type="button" aria-label="Переподключить" title="Снова">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.1A6 6 0 1 1 16.2 8.2L13 11h7V4l-2.35 2.35Z"/></svg>
      </button>
      <button id="flip" class="icon-btn" type="button" aria-label="Повернуть 180°" title="Повернуть 180°">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L8 6l4 4V7c2.76 0 5 2.24 5 5s-2.24 5-5 5-5-2.24-5-5H5c0 3.87 3.13 7 7 7s7-3.13 7-7-3.13-7-7-7z"/></svg>
      </button>
      <button id="camera" class="icon-btn" type="button" aria-label="Сменить камеру" title="Сменить камеру">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3 7.17 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 3H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.2a2.8 2.8 0 1 0 0-5.6 2.8 2.8 0 0 0 0 5.6z"/></svg>
      </button>
      <button id="fs" class="icon-btn" type="button" aria-label="Полный экран" title="Полный экран">
        <svg class="fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        <svg class="fs-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
      </button>
    </div>
  </div>
  <script>
    (function () {
      var video = document.getElementById('video');
      var stage = document.getElementById('stage');
      var status = document.getElementById('status');
      var battery = document.getElementById('battery');
      var wakeHint = document.getElementById('wake-hint');
      var stopBtn = document.getElementById('stop');
      var watchBtn = document.getElementById('watch');
      var retryBtn = document.getElementById('retry');
      var flipBtn = document.getElementById('flip');
      var cameraBtn = document.getElementById('camera');
      var fsBtn = document.getElementById('fs');
      var pc = null;
      var reconnectTimer = null;
      var disconnectTimer = null;
      var batteryTimer = null;
      var dutyTimer = null;
      var screenWakeLock = null;
      var wakeHintShown = false;
      var generation = 0;
      var stopped = false;
      var sessionId = null;
      var lastFrameAt = 0;
      var frameCallbackStarted = false;
      var cameraFacing = 'back';
      var userFlip = false;

      function isTouchUi() {
        return window.matchMedia('(hover: none) and (pointer: coarse)').matches;
      }

      function rotationOffset() {
        var base = cameraFacing === 'back' ? 180 : 0;
        return userFlip ? (base + 180) % 360 : base;
      }

      function syncControls(isWatching) {
        if (!isWatching || !isTouchUi()) {
          document.body.classList.add('controls-on');
          return;
        }
        document.body.classList.remove('controls-on');
      }

      function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      }

      function syncFullscreenUi() {
        var on = isFullscreen();
        fsBtn.classList.toggle('fs-on', on);
        fsBtn.setAttribute('aria-label', on ? 'Выйти из полного экрана' : 'Полный экран');
        fsBtn.title = on ? 'Окно' : 'Полный экран';
      }

      function toggleFullscreen() {
        if (isFullscreen()) {
          var exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) {
            exit.call(document);
          }
          return;
        }
        var req = stage.requestFullscreen || stage.webkitRequestFullscreen;
        if (req) {
          var result = req.call(stage);
          if (result && result.catch) {
            result.catch(function () {
              if (video.webkitEnterFullscreen) {
                video.webkitEnterFullscreen();
              }
            });
          }
          return;
        }
        if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        }
      }

      function layoutVideo() {
        if (!stage) {
          return;
        }
        var portrait = video.videoHeight > video.videoWidth;
        var rotate = cameraFacing === 'back' && portrait && video.videoHeight > 0;
        var offset = rotationOffset();
        video.classList.toggle('landscape-rotate', rotate);
        if (!rotate) {
          video.style.width = '100%';
          video.style.height = '100%';
          video.style.transform = offset ? ('rotate(' + offset + 'deg)') : '';
          return;
        }
        var size = stageSize();
        var sw = size.width;
        var sh = size.height;
        video.style.width = sh + 'px';
        video.style.height = sw + 'px';
        video.style.transform = 'translate(-50%, -50%) rotate(' + (90 + offset) + 'deg)';
      }

      function stageSize() {
        var viewport = window.visualViewport;
        return {
          width: viewport ? Math.min(stage.clientWidth, viewport.width) : stage.clientWidth,
          height: viewport ? Math.min(stage.clientHeight, viewport.height) : stage.clientHeight
        };
      }

      function cookiePin() {
        var match = document.cookie.match(/(?:^|; )pin=([^;]*)/);
        return match ? decodeURIComponent(match[1]) : '';
      }

      function pinHeaders() {
        var headers = { 'X-Pin': cookiePin() };
        if (sessionId) {
          headers['X-Session'] = sessionId;
        }
        return headers;
      }

      function setStatus(text, isError) {
        status.textContent = text;
        status.className = isError ? 'error' : '';
      }

      function setWatchingUi(isWatching) {
        stopBtn.hidden = !isWatching;
        watchBtn.hidden = isWatching;
        retryBtn.hidden = !isWatching;
        syncControls(isWatching);
      }

      async function acquireScreenWakeLock() {
        if (stopped || document.visibilityState !== 'visible' || screenWakeLock) {
          return;
        }
        if (!window.isSecureContext || !('wakeLock' in navigator)) {
          showWakeLockHint();
          return;
        }
        try {
          screenWakeLock = await navigator.wakeLock.request('screen');
          screenWakeLock.addEventListener('release', function () {
            screenWakeLock = null;
          }, { once: true });
        } catch (error) {
          // API недоступен на небезопасном HTTP или ОС запретила блокировку.
          screenWakeLock = null;
          showWakeLockHint();
        }
      }

      function showWakeLockHint() {
        if (wakeHintShown) {
          return;
        }
        wakeHintShown = true;
        wakeHint.textContent = 'Экран может погаснуть: блокировка недоступна в этом браузере.';
      }

      async function releaseScreenWakeLock() {
        var wakeLock = screenWakeLock;
        screenWakeLock = null;
        if (!wakeLock) {
          return;
        }
        try {
          await wakeLock.release();
        } catch (error) {
          // Браузер мог уже снять блокировку при уходе страницы в фон.
        }
      }

      function restoreViewingAfterResume() {
        if (stopped || document.visibilityState !== 'visible') {
          return;
        }
        acquireScreenWakeLock();
        if (!pc && generation === 0) {
          return;
        }
        var state = pc ? pc.iceConnectionState : 'closed';
        if (state === 'failed' || state === 'disconnected' || state === 'closed') {
          clearReconnect();
          reconnectOwnedSession();
          return;
        }
        if (isVideoStale(2500)) {
          clearReconnect();
          reconnectOwnedSession();
        }
      }

      function trackVideoFrames() {
        if (frameCallbackStarted) {
          return;
        }
        frameCallbackStarted = true;
        if (video.requestVideoFrameCallback) {
          var onFrame = function () {
            lastFrameAt = Date.now();
            video.requestVideoFrameCallback(onFrame);
          };
          video.requestVideoFrameCallback(onFrame);
          return;
        }
        video.addEventListener('timeupdate', function () {
          lastFrameAt = Date.now();
        });
      }

      function isVideoStale(thresholdMs) {
        if (!video.srcObject || video.readyState < 2) {
          return true;
        }
        return lastFrameAt > 0 && Date.now() - lastFrameAt > thresholdMs;
      }

      function waitIceComplete(peer, timeoutMs) {
        return new Promise(function (resolve) {
          var finished = false;
          function finish() {
            if (finished) {
              return;
            }
            finished = true;
            peer.onicegatheringstatechange = null;
            resolve();
          }
          peer.onicegatheringstatechange = function () {
            if (peer.iceGatheringState === 'complete') {
              finish();
            }
          };
          if (peer.iceGatheringState === 'complete') {
            finish();
            return;
          }
          setTimeout(finish, timeoutMs);
        });
      }

      function closePeer() {
        if (pc) {
          pc.onicecandidate = null;
          pc.ontrack = null;
          pc.onicegatheringstatechange = null;
          pc.oniceconnectionstatechange = null;
          pc.close();
          pc = null;
        }
        video.srcObject = null;
      }

      function clearReconnect() {
        if (reconnectTimer) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }
        if (disconnectTimer) {
          clearTimeout(disconnectTimer);
          disconnectTimer = null;
        }
      }

      async function stopDueToDutyOff() {
        if (stopped) {
          return;
        }
        stopped = true;
        generation += 1;
        clearReconnect();
        closePeer();
        if (batteryTimer) {
          clearInterval(batteryTimer);
          batteryTimer = null;
        }
        if (dutyTimer) {
          clearInterval(dutyTimer);
          dutyTimer = null;
        }
        await releaseScreenWakeLock();
        wakeHint.textContent = '';
        setWatchingUi(false);
        setStatus('Дежурный режим выключен на телефоне', true);
        sessionId = null;
      }

      async function checkDutyActive() {
        if (stopped) {
          return;
        }
        try {
          var response = await fetch('/health', { cache: 'no-store' });
          if (!response.ok) {
            return;
          }
          var data = await response.json();
          if (data.duty === false) {
            await stopDueToDutyOff();
          }
        } catch (error) {
          // Нет ответа не доказывает выключение: это может быть временный сбой сети.
        }
      }

      function scheduleReconnect(message) {
        if (stopped) {
          return;
        }
        setStatus(message, true);
        closePeer();
        checkDutyActive();
        if (reconnectTimer) {
          return;
        }
        reconnectTimer = setTimeout(function () {
          reconnectTimer = null;
          reconnectOwnedSession();
        }, 2000);
      }

      async function reconnectOwnedSession() {
        await hangup();
        sessionId = null;
        connect();
      }

      async function hangup() {
        var pin = cookiePin();
        if (pin.length !== 4) {
          return;
        }
        try {
          await fetch('/hangup', {
            method: 'POST',
            headers: pinHeaders(),
            keepalive: true
          });
        } catch (error) {
        }
      }

      async function stopWatch() {
        stopped = true;
        generation += 1;
        clearReconnect();
        closePeer();
        await releaseScreenWakeLock();
        wakeHint.textContent = '';
        wakeHintShown = false;
        setWatchingUi(false);
        setStatus('Просмотр остановлен', false);
        await hangup();
        sessionId = null;
      }

      async function refreshBattery() {
        var pin = cookiePin();
        if (pin.length !== 4) {
          return;
        }
        try {
          var response = await fetch('/status', { headers: pinHeaders() });
          if (response.status === 401) {
            document.cookie = 'pin=; Path=/; Max-Age=0';
            location.reload();
            return;
          }
          if (!response.ok) {
            return;
          }
          var data = await response.json();
          if (data.duty === false) {
            await stopDueToDutyOff();
            return;
          }
          if (data.camera === 'front' || data.camera === 'back') {
            if (cameraFacing !== data.camera) {
              userFlip = false;
            }
            cameraFacing = data.camera;
            layoutVideo();
          }
          if (typeof data.battery === 'number') {
            battery.textContent = 'Заряд телефона ' + data.battery + '%';
          } else {
            battery.textContent = 'Заряд телефона неизвестен';
          }
        } catch (error) {
        }
      }

      async function connect() {
        if (stopped) {
          return;
        }
        var myGeneration = ++generation;
        closePeer();
        setWatchingUi(true);
        setStatus('Подключение…', false);
        acquireScreenWakeLock();

        var pin = cookiePin();
        if (pin.length !== 4) {
          location.reload();
          return;
        }

        try {
          pc = new RTCPeerConnection({
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
          });
          pc.addTransceiver('video', { direction: 'recvonly' });
          pc.ontrack = function (event) {
            video.srcObject = event.streams[0];
            trackVideoFrames();
            layoutVideo();
          };
          pc.oniceconnectionstatechange = function () {
            if (!pc || myGeneration !== generation || stopped) {
              return;
            }
            if (pc.iceConnectionState === 'failed') {
              scheduleReconnect('Связь оборвалась, переподключение…');
              return;
            }
            if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
              if (disconnectTimer) {
                clearTimeout(disconnectTimer);
                disconnectTimer = null;
              }
              return;
            }
            if (pc.iceConnectionState === 'disconnected' && !disconnectTimer) {
              disconnectTimer = setTimeout(function () {
                disconnectTimer = null;
                if (pc && pc.iceConnectionState === 'disconnected') {
                  scheduleReconnect('Связь оборвалась, переподключение…');
                }
              }, 2500);
            }
          };

          var offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          setStatus('Сбор адреса…', false);
          await waitIceComplete(pc, 3000);
          if (myGeneration !== generation || stopped) {
            return;
          }

          setStatus('Ожидание камеры…', false);
          var controller = new AbortController();
          var fetchTimer = setTimeout(function () { controller.abort(); }, 20000);
          var response;
          try {
            response = await fetch('/offer', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json; charset=utf-8',
                'X-Pin': pin
              },
              signal: controller.signal,
              body: JSON.stringify({
                type: pc.localDescription.type,
                sdp: pc.localDescription.sdp
              })
            });
          } finally {
            clearTimeout(fetchTimer);
          }

          if (myGeneration !== generation || stopped) {
            return;
          }

          if (response.status === 401) {
            document.cookie = 'pin=; Path=/; Max-Age=0';
            location.reload();
            return;
          }

          if (response.status === 409) {
            stopped = true;
            closePeer();
            sessionId = null;
            clearReconnect();
            setWatchingUi(false);
            setStatus('Камера занята другим зрителем', true);
            return;
          }

          if (response.status === 503) {
            try {
              var unavailable = await response.json();
              if (unavailable.duty === false) {
                await stopDueToDutyOff();
                return;
              }
            } catch (error) {
            }
          }

          if (!response.ok) {
            scheduleReconnect('Ошибка offer: ' + response.status);
            return;
          }

          var answer = await response.json();
          if (!answer || !answer.sdp) {
            scheduleReconnect('Нет ответа SDP, повтор…');
            return;
          }

          if (!answer.sessionId) {
            scheduleReconnect('Нет идентификатора сессии, повтор…');
            return;
          }

          sessionId = answer.sessionId;
          await pc.setRemoteDescription(answer);
          setStatus('Просмотр', false);
        } catch (error) {
          if (myGeneration !== generation || stopped) {
            return;
          }
          scheduleReconnect('Сбой подключения, повтор…');
        }
      }

      stopBtn.onclick = function () { stopWatch(); };
      watchBtn.onclick = function () {
        stopped = false;
        connect();
      };
      retryBtn.onclick = function () {
        clearReconnect();
        reconnectOwnedSession();
      };
      flipBtn.onclick = function () {
        userFlip = !userFlip;
        layoutVideo();
      };
      cameraBtn.onclick = function () { switchCamera(); };
      fsBtn.onclick = function () { toggleFullscreen(); };
      document.addEventListener('fullscreenchange', function () {
        syncFullscreenUi();
        layoutVideo();
      });
      document.addEventListener('webkitfullscreenchange', function () {
        syncFullscreenUi();
        layoutVideo();
      });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          restoreViewingAfterResume();
        }
      });
      window.addEventListener('pageshow', restoreViewingAfterResume);
      async function switchCamera() {
        var pin = cookiePin();
        if (pin.length !== 4) {
          return;
        }
        try {
          var response = await fetch('/camera', {
            method: 'POST',
            headers: pinHeaders()
          });
          if (response.status === 401) {
            document.cookie = 'pin=; Path=/; Max-Age=0';
            location.reload();
            return;
          }
          if (!response.ok) {
            return;
          }
          await refreshBattery();
        } catch (error) {
        }
      }
      stage.addEventListener('click', function (event) {
        if (!isTouchUi() || event.target.closest('.actions')) {
          return;
        }
        document.body.classList.toggle('controls-on');
      });
      batteryTimer = setInterval(refreshBattery, 30000);
      dutyTimer = setInterval(checkDutyActive, 1000);
      refreshBattery();
      checkDutyActive();
      video.addEventListener('loadedmetadata', layoutVideo);
      window.addEventListener('resize', layoutVideo);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', layoutVideo);
        window.visualViewport.addEventListener('scroll', layoutVideo);
      }
      connect();
    })();
  </script>
</body>
</html>
